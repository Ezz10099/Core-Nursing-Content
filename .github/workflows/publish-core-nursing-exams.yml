name: Publish generated Core Nursing exam data
on:
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'exams/authoring/**'
      - 'exams/sources.json'
      - 'scripts/build_exams.py'
      - 'scripts/build_runtime_exam_data.py'
permissions:
  contents: write
concurrency:
  group: core-nursing-exam-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source-bound exam banks
        run: python scripts/build_exams.py
      - name: Package runtime exam data
        run: python scripts/build_runtime_exam_data.py
      - name: Regenerate runtime manifest
        run: python scripts/generate_runtime_manifest.py
      - name: Commit generated exam/runtime files
        run: |
          git add exams/generated runtime/files/js/exam-data*.js runtime/runtime-manifest.json runtime/objects
          if git diff --cached --quiet; then
            echo "Generated exam data already current."
            exit 0
          fi
          git config user.name "Core Nursing Exam Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish generated Core Nursing exam data"
          git pull --rebase origin main
          git push origin HEAD:main
