name: Pre-sign Core Nursing private Q&A runtime v34
on:
  push:
    branches:
      - updates/private-qa-inbox-v34
    paths:
      - '.github/workflows/sign-private-qa-staged.yml'
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates/private-qa-inbox-v34
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staged runtime release
        run: |
          python scripts/generate_runtime_manifest.py
          test -z "$(git status --porcelain -- runtime/runtime-manifest.json runtime/objects)"
          python scripts/validate_runtime.py
      - name: Sign runtime manifest with existing official key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.CORE_NURSING_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "$UPDATE_SIGNING_KEY"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/core-nursing-signer.pem"
          chmod 600 "$RUNNER_TEMP/core-nursing-signer.pem"
          openssl pkey -in "$RUNNER_TEMP/core-nursing-signer.pem" -pubout -out "$RUNNER_TEMP/derived-public.pem"
          diff update-signing-public-key.pem "$RUNNER_TEMP/derived-public.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/core-nursing-signer.pem" -out "$RUNNER_TEMP/signature.bin" runtime/runtime-manifest.json
          base64 -w 0 "$RUNNER_TEMP/signature.bin" > runtime/runtime-manifest.sig
          printf '\n' >> runtime/runtime-manifest.sig
          openssl dgst -sha256 -verify update-signing-public-key.pem -signature "$RUNNER_TEMP/signature.bin" runtime/runtime-manifest.json
          rm -f "$RUNNER_TEMP/core-nursing-signer.pem" "$RUNNER_TEMP/signature.bin"
      - name: Commit signed manifest on staging branch
        run: |
          git add runtime/runtime-manifest.sig
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Core Nursing Update Signer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sign staged Core Nursing private Q&A runtime"
          git push origin HEAD:updates/private-qa-inbox-v34
