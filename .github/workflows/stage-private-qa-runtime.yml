name: Stage private Q&A runtime release
on:
  push:
    branches:
      - feature/private-qa-notebook-20261102
    paths:
      - 'runtime/files/**'
      - 'scripts/generate_runtime_manifest.py'
      - 'tests/question-inbox.cjs'
      - '.github/workflows/stage-private-qa-runtime.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-qa-notebook-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: |
          for f in runtime/files/js/*.js; do node --check "$f"; done
      - name: Test offline inbox and private sync
        run: |
          npm install --prefix "$RUNNER_TEMP/core-nursing-test" --no-audit --no-fund jsdom@30.1.3
          NODE_PATH="$RUNNER_TEMP/core-nursing-test/node_modules" node tests/question-inbox.cjs
      - name: Regression tests for existing study flows
        run: |
          python scripts/build_exams.py --check
          python tests/exam-banks.py
          python scripts/build_runtime_exam_data.py --check
          node tests/exam-core.cjs
          export NODE_PATH="$RUNNER_TEMP/core-nursing-test/node_modules"
          node tests/reading-progress.cjs
          node tests/study-ui.cjs
          node tests/question-marks.cjs
          node tests/exams-ui.cjs
          node tests/updates-ui.cjs
      - name: Generate content-addressed objects and manifest
        run: python scripts/generate_runtime_manifest.py
      - name: Validate release
        run: python scripts/validate_runtime.py
      - name: Commit staged release (not live)
        run: |
          git add runtime/runtime-manifest.json runtime/objects
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Core Nursing Stage Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stage generated private Q&A runtime v34"
          git push origin HEAD:feature/private-qa-notebook-20261102
