name: Stage Core Nursing Q&A runtime v35
on:
  push:
    branches: [updates/private-questions-v35]
    paths:
      - 'runtime/files/**'
      - 'scripts/generate_runtime_manifest.py'
      - '.github/workflows/stage-private-qa-v35.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates/private-questions-v35
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in runtime/files/js/*.js; do node --check "$f"; done
      - name: Test private Q&A and existing exams
        run: |
          npm install --prefix "$RUNNER_TEMP/core-nursing-test" --no-audit --no-fund jsdom@30.1.3
          export NODE_PATH="$RUNNER_TEMP/core-nursing-test/node_modules"
          python scripts/build_exams.py --check
          python tests/exam-banks.py
          python scripts/build_runtime_exam_data.py --check
          node tests/exam-core.cjs
          node tests/reading-progress.cjs
          node tests/study-ui.cjs
          node tests/question-marks.cjs
          node tests/exams-ui.cjs
          node tests/updates-ui.cjs
          node tests/question-inbox.cjs
      - name: Generate signed-channel payload and validate
        run: |
          python scripts/generate_runtime_manifest.py
          python scripts/validate_runtime.py
      - name: Publish immutable staged files and manifest on update branch
        run: |
          git add runtime/runtime-manifest.json runtime/objects
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Core Nursing Stage Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stage Core Nursing question inbox runtime v35"
          git push origin HEAD:updates/private-questions-v35
