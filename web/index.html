<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1017">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Core Nursing">
  <title>Core Nursing</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #0d1017; color: #eef2f7; display: grid; place-items: center; }
    main { width: min(34rem, calc(100% - 2rem)); padding: 1.5rem; border: 1px solid #29313d; border-radius: 1rem; background: #151a22; box-sizing: border-box; }
    h1 { margin: 0 0 .75rem; font-size: 1.35rem; }
    p { margin: .4rem 0; color: #b8c2cf; line-height: 1.5; }
    button { margin-top: 1rem; border: 0; border-radius: .75rem; padding: .8rem 1rem; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Core Nursing</h1>
    <p id="bootStatus">Verifying and loading the current Core Nursing release...</p>
    <button id="retryBoot" type="button" hidden onclick="window.location.reload()">Retry</button>
  </main>
  <script src="boot.js"></script>
</body>
</html>
